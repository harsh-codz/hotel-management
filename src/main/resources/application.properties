spring.application.name=hotel-admin-backend
server.port=8081

# H2 Database configuration (File-based for persistence between restarts)
# jdbc:h2:file:./hoteldb will create/use 'hoteldb.mv.db' and 'hoteldb.trace.db' in the project root directory
spring.datasource.url=jdbc:h2:file:./hoteldb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA/Hibernate configuration
# 'update' is good for development, syncs schema with entities. Use 'validate' or migrations for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (Optional, enables browser access to H2 database)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# IMPORTANT: In a real application, secure or disable the H2 console for production!
# spring.security.web.ignoring.request-matches=/h2-console/** # You'll need to configure Spring Security to allow access


# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
# Optional: Add basic info
springdoc.swagger-ui.title=Hotel Admin Panel API
springdoc.swagger-ui.version=v0.0.1
springdoc.swagger-ui.description=API documentation for the Hotel Admin Backend